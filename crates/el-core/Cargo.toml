[package]
name = "el-core"
version = "0.0.0"
edition = "2021"
publish = false

# Pure Rust core (no UI or Tauri dependencies). Native ports of the app's pixel algorithms (src/features/segmentation/gray-filters.ts, preprocessing.ts,
# src/domain/refine/edge-refine.ts). Results match the JS versions;
# tests/unit/native/compute-parity.test.ts checks that through the compute-cli binary.

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing (the default parser is off by one ulp for about 1 in 9 values), so box
# coordinates from the page reach Rust as the page has them. Feature unification turns it on for src-tauri too.
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
