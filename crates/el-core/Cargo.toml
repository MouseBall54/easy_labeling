[package]
name = "el-core"
version = "0.0.0"
edition = "2021"
publish = false

# Pure Rust core (no UI or Tauri dependencies). Native ports of the app's pixel algorithms (src/features/segmentation/gray-filters.ts, preprocessing.ts,
# src/domain/refine/edge-refine.ts). Results match the JS versions;
# tests/unit/native/compute-parity.test.ts checks that through the compute-cli binary.

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
