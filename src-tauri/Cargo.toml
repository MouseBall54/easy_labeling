[package]
name = "easy-labeling"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native file and message dialogs. Not tauri-plugin-dialog: its page script swaps window.confirm for an async
# function (a Promise is always truthy), while WebView2's own confirm/alert are synchronous like a browser's.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
el-core = { path = "../crates/el-core" }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi"] }
# The WebView2 bindings wry uses, for serving the frontend folder through a virtual host.
webview2-com = "0.39"
windows-core = "0.62"
